# Stammtisch configuration.
# Model weights live off the C: drive — C: only has ~18 GB free.

paths:
  models_root: D:/stammtisch-models
  sessions_dir: ./sessions
  # Textbooks turned into a syllabus by scripts/ingest_textbook.py. Gitignored:
  # the content is copyrighted and this repository is public.
  courses_dir: ./courses

audio:
  # Whisper wants 16 kHz mono. Piper emits at its own rate (see tts.sample_rate).
  input_sample_rate: 16000
  frame_ms: 32              # Silero VAD operates on 512-sample frames @ 16 kHz
  input_device: null        # null = system default; set to an index from list_devices()
  output_device: null

vad:
  threshold: 0.5            # Silero speech probability. Raise if it triggers on noise.
  min_speech_ms: 250        # ignore blips shorter than this
  end_silence_ms: 450       # silence needed to call the turn over — the main latency knob
  max_utterance_ms: 30000   # hard cap so a runaway stream can't grow forever
  pre_roll_ms: 300          # audio retained from *before* trigger, so we don't clip onsets

stt:
  model: large-v3-turbo     # distil-large-v3 is faster; medium if VRAM gets tight
  device: cuda
  compute_type: float16
  language: de
  beam_size: 1              # greedy — beam search costs latency for little gain here
  vad_filter: false         # we already gate with Silero upstream
  # Mentor mode auto-detects, but only between these. Unrestricted, Whisper
  # labelled a third of one real session Urdu/Arabic/Chinese and transcribed
  # it as such. Two seconds of accented speech cannot pick from 99 languages.
  detect_languages: [de, en]

llm:
  # Any OpenAI-compatible server: Ollama (11434), LM Studio (1234), llama.cpp (8080).
  base_url: http://localhost:11434/v1
  api_key: not-needed
  # gemma3:12b gives better German but is slow on a power-limited laptop.
  # gemma3:4b is roughly 3x faster and usually the better trade for A1/A2,
  # where sentences are short and correctness matters more than nuance.
  model: gemma3:4b
  temperature: 0.7
  # Short replies are not a style choice: with barge_in off the learner cannot
  # speak until the tutor stops, so every extra sentence is enforced silence.
  max_tokens: 140
  keep_alive: 30m           # Ollama unloads after 5m idle; a reload costs ~16s
  num_ctx: 8192             # system prompt + history does not fit in 4096
  # A second, smaller model handles corrections off the critical path.
  # Point at the same model if you'd rather not hold two in VRAM.
  corrector_model: gemma3:4b
  corrector_temperature: 0.1

tts:
  # One voice per language — the mentor speaks English with German examples,
  # and each voice mangles the other's language if given the wrong text.
  voices:
    de: de_DE-thorsten-high
    en: en_US-lessac-medium
  primary: de               # this voice's sample rate drives the output stream
  sample_rate: 22050        # overwritten at load from the primary voice
  length_scale: 1.1         # >1.0 = slower speech. Helpful at A1/A2.
  noise_scale: 0.667
  noise_w: 0.8

tutor:
  # mentor   = teaches in English, German examples in «guillemets»
  # practice = German immersion, conversation partner
  mode: mentor
  level: A1                 # CEFR: A1 A2 B1 B2 C1
  scenario: grundlagen      # used only when chapter is 0
  # Follow your own textbook. Ingest it first:
  #   python scripts/ingest_textbook.py "path/to/book.pdf"
  # Then set chapter to the one your class is on. 0 uses `scenario` instead.
  course: ""                # file stem in paths.courses_dir; blank = the only one
  chapter: 0                # 0 with resume:true means "carry on where I left off"
  resume: true              # start at the chapter the last session ended on
  history_turns: 12         # conversation turns kept in context
  # Let the user interrupt the tutor mid-sentence. Requires headphones: with
  # laptop speakers the tutor hears itself and interrupts itself. There is a
  # transcript-similarity echo guard as a backstop either way, but on speakers
  # this is best left off.
  barge_in: false

learner:
  # Your name, so the grammar corrector leaves it alone. Whisper mangles names
  # badly ("Vamshee" came back as Fahmshidharan, Wamsi, Wanzi in one session)
  # and the corrector then "fixes" the mangling into a different name and
  # reports it as a German mistake. Set this to whatever you actually say when
  # you introduce yourself.
  name: Vamshee Dharan
  native_language: English
